<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致最特别的你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Georgia', 'Songti SC', 'STSong', serif;
    background: linear-gradient(135deg, #1a0a1f 0%, #2d1b3d 30%, #4a1942 60%, #6b2d5c 100%);
    cursor: pointer;
    user-select: none;
  }

  /* 背景光晕 */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 {
    width: 400px; height: 400px;
    background: #ff6b9d;
    top: -100px; left: -100px;
    animation: float1 8s ease-in-out infinite;
  }
  .glow-2 {
    width: 350px; height: 350px;
    background: #c44dff;
    bottom: -80px; right: -80px;
    animation: float2 10s ease-in-out infinite;
  }
  .glow-3 {
    width: 300px; height: 300px;
    background: #ff4d6d;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(50px, 30px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-40px, -50px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.3); }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .heart-icon {
    font-size: 60px;
    animation: heartbeat 1.2s ease-in-out infinite;
    margin-bottom: 30px;
    filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.8));
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  .title {
    font-size: clamp(28px, 6vw, 52px);
    color: #fff;
    margin-bottom: 24px;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(255, 182, 193, 0.6);
    animation: fadeInUp 1.2s ease-out;
  }

  .message {
    font-size: clamp(16px, 3vw, 22px);
    color: rgba(255, 255, 255, 0.85);
    line-height: 2;
    max-width: 600px;
    margin-bottom: 16px;
    animation: fadeInUp 1.2s ease-out 0.3s both;
  }

  .message-2 {
    font-size: clamp(14px, 2.5vw, 18px);
    color: rgba(255, 182, 193, 0.7);
    line-height: 1.8;
    max-width: 500px;
    margin-bottom: 40px;
    animation: fadeInUp 1.2s ease-out 0.6s both;
  }

  .signature {
    font-size: clamp(14px, 2.5vw, 18px);
    color: rgba(255, 255, 255, 0.6);
    font-style: italic;
    animation: fadeInUp 1.2s ease-out 0.9s both;
  }

  .hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.4);
    font-size: 14px;
    letter-spacing: 2px;
    animation: blink 2s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 点击爆出的爱心 */
  .click-heart {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 24px;
    animation: burst 1.2s ease-out forwards;
  }
  @keyframes burst {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
    }
    20% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.5) rotate(15deg);
    }
    100% {
      opacity: 0;
      transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rot));
    }
  }

  /* 背景飘落爱心 */
  .falling-heart {
    position: fixed;
    top: -30px;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% {
      opacity: 0;
      transform: translateY(0) rotate(0deg);
    }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% {
      opacity: 0;
      transform: translateY(105vh) rotate(360deg);
    }
  }
</style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="container">
  <div class="heart-icon">❤️</div>
  <h1 class="title">遇见你，是我最幸运的事</h1>
  <p class="message">
    从见到你的第一眼起，<br>
    我的世界便有了不一样的色彩。<br>
    你的笑容是我每天最期待的风景，<br>
    你的声音是我耳边最温柔的旋律。
  </p>
  <p class="message-2">
    想和你一起看日出日落，<br>
    想和你一起走过春夏秋冬，<br>
    想把所有的浪漫都留给你。
  </p>
  <p class="signature">—— 永远喜欢你的人</p>
</div>

<div class="hint">✦ 点击屏幕任意位置 ✦</div>

<script>
  // 点击爆出爱心
  const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '💝', '💘', '🩷', '💞'];
  
  document.addEventListener('click', function(e) {
    const count = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      createHeart(e.clientX, e.clientY);
    }
  });

  // 触摸支持
  document.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    const count = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      createHeart(touch.clientX, touch.clientY);
    }
  }, { passive: true });

  function createHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'click-heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    
    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 120;
    const tx = Math.cos(angle) * distance + 'px';
    const ty = Math.sin(angle) * distance + 'px';
    const rot = (Math.random() * 720 - 360) + 'deg';
    
    heart.style.setProperty('--tx', tx);
    heart.style.setProperty('--ty', ty);
    heart.style.setProperty('--rot', rot);
    heart.style.fontSize = (16 + Math.random() * 20) + 'px';
    
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1200);
  }

  // 背景飘落爱心
  function createFallingHeart() {
    const heart = document.createElement('div');
    heart.className = 'falling-heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (12 + Math.random() * 18) + 'px';
    const duration = 6 + Math.random() * 8;
    heart.style.animationDuration = duration + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), duration * 1000);
  }

  // 持续生成飘落爱心
  setInterval(createFallingHeart, 600);
  // 初始生成一批
  for (let i = 0; i < 8; i++) {
    setTimeout(createFallingHeart, i * 200);
  }
</script>

</body>
</html>
